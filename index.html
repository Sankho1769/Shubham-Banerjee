<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHUBHAM BANERJEE 2005-2030</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white px-4">

    <div class="max-w-4xl w-full text-center">
        <div class="mb-8 animate-fade-in-down">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
                The Big Day
            </h1>
            <p class="text-lg md:text-xl text-gray-300 font-light tracking-wide mb-8">
                Counting down to October 16, 2030 at 9:40 PM
            </p>
            
            <div class="flex justify-center flex-wrap gap-3 mb-8">
                <button id="btn-default" class="px-5 py-2 rounded-lg backdrop-blur-md bg-white/20 border border-white/40 transition-all text-sm font-semibold tracking-wide">
                    Standard View
                </button>
                <button id="btn-minutes" class="px-5 py-2 rounded-lg backdrop-blur-md bg-white/5 border border-transparent hover:bg-white/10 transition-all text-sm font-semibold tracking-wide">
                    Minutes Only
                </button>
                <button id="btn-seconds" class="px-5 py-2 rounded-lg backdrop-blur-md bg-white/5 border border-transparent hover:bg-white/10 transition-all text-sm font-semibold tracking-wide">
                    Seconds Only
                </button>
            </div>
        </div>

        <div id="countdown-container" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center transition-transform hover:scale-105 duration-300">
                <span id="days" class="font-mono text-5xl md:text-7xl font-bold text-white mb-2">00</span>
                <span class="text-sm md:text-base text-gray-400 uppercase tracking-widest font-semibold">Days</span>
            </div>
            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center transition-transform hover:scale-105 duration-300">
                <span id="hours" class="font-mono text-5xl md:text-7xl font-bold text-white mb-2">00</span>
                <span class="text-sm md:text-base text-gray-400 uppercase tracking-widest font-semibold">Hours</span>
            </div>
            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center transition-transform hover:scale-105 duration-300">
                <span id="minutes" class="font-mono text-5xl md:text-7xl font-bold text-white mb-2">00</span>
                <span class="text-sm md:text-base text-gray-400 uppercase tracking-widest font-semibold">Minutes</span>
            </div>
            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center transition-transform hover:scale-105 duration-300">
                <span id="seconds" class="font-mono text-5xl md:text-7xl font-bold text-purple-400 mb-2">00</span>
                <span class="text-sm md:text-base text-gray-400 uppercase tracking-widest font-semibold">Seconds</span>
            </div>
        </div>

        <div id="single-container" class="hidden flex justify-center">
            <div class="glass-card rounded-2xl p-8 md:p-12 flex flex-col items-center justify-center transition-transform hover:scale-105 duration-300 w-full max-w-2xl">
                <span id="single-value" class="font-mono text-5xl md:text-7xl lg:text-8xl font-bold text-white mb-4 break-all">00</span>
                <span id="single-label" class="text-base md:text-xl text-gray-400 uppercase tracking-widest font-semibold">Total</span>
            </div>
        </div>

        <div id="finished-message" class="hidden mt-12">
            <h2 class="text-4xl md:text-6xl font-bold text-green-400 animate-pulse">
                The time has arrived!
            </h2>
        </div>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const targetDate = new Date("October 16, 2030 21:40:00").getTime();

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const containerEl = document.getElementById('countdown-container');
            const singleContainerEl = document.getElementById('single-container');
            const singleValueEl = document.getElementById('single-value');
            const singleLabelEl = document.getElementById('single-label');
            const finishedEl = document.getElementById('finished-message');

            const btnDefault = document.getElementById('btn-default');
            const btnMinutes = document.getElementById('btn-minutes');
            const btnSeconds = document.getElementById('btn-seconds');

            let currentMode = 'default';

            const updateButtons = () => {
                const buttons = [btnDefault, btnMinutes, btnSeconds];
                buttons.forEach(btn => {
                    btn.classList.remove('bg-white/20', 'border-white/40');
                    btn.classList.add('bg-white/5', 'border-transparent');
                });

                if (currentMode === 'default') {
                    btnDefault.classList.add('bg-white/20', 'border-white/40');
                    btnDefault.classList.remove('bg-white/5', 'border-transparent');
                } else if (currentMode === 'minutes') {
                    btnMinutes.classList.add('bg-white/20', 'border-white/40');
                    btnMinutes.classList.remove('bg-white/5', 'border-transparent');
                } else if (currentMode === 'seconds') {
                    btnSeconds.classList.add('bg-white/20', 'border-white/40');
                    btnSeconds.classList.remove('bg-white/5', 'border-transparent');
                }
            };

            const switchMode = (mode) => {
                currentMode = mode;
                updateButtons();
                
                if (currentMode === 'default') {
                    containerEl.classList.remove('hidden');
                    containerEl.classList.add('grid');
                    singleContainerEl.classList.add('hidden');
                    singleContainerEl.classList.remove('flex');
                } else {
                    containerEl.classList.add('hidden');
                    containerEl.classList.remove('grid');
                    singleContainerEl.classList.remove('hidden');
                    singleContainerEl.classList.add('flex');
                    singleLabelEl.textContent = currentMode === 'minutes' ? 'Total Minutes' : 'Total Seconds';
                    
                    if (currentMode === 'seconds') {
                        singleValueEl.classList.add('text-purple-400');
                        singleValueEl.classList.remove('text-white');
                    } else {
                        singleValueEl.classList.remove('text-purple-400');
                        singleValueEl.classList.add('text-white');
                    }
                }
                updateTimer();
            };

            btnDefault.addEventListener('click', () => switchMode('default'));
            btnMinutes.addEventListener('click', () => switchMode('minutes'));
            btnSeconds.addEventListener('click', () => switchMode('seconds'));

            const formatTime = (time) => {
                return time < 10 ? `0${time}` : time;
            };

            const updateTimer = () => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    clearInterval(timerInterval);
                    containerEl.classList.add('hidden');
                    containerEl.classList.remove('grid');
                    singleContainerEl.classList.add('hidden');
                    singleContainerEl.classList.remove('flex');
                    finishedEl.classList.remove('hidden');
                    return;
                }

                if (currentMode === 'default') {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    daysEl.textContent = formatTime(days);
                    hoursEl.textContent = formatTime(hours);
                    minutesEl.textContent = formatTime(minutes);
                    secondsEl.textContent = formatTime(seconds);
                } else if (currentMode === 'minutes') {
                    const totalMinutes = Math.floor(distance / (1000 * 60));
                    singleValueEl.textContent = totalMinutes.toLocaleString();
                } else if (currentMode === 'seconds') {
                    const totalSeconds = Math.floor(distance / 1000);
                    singleValueEl.textContent = totalSeconds.toLocaleString();
                }
            }; 

            updateTimer();
            const timerInterval = setInterval(updateTimer, 1000);
        });
    </script>
</body>
</html>
